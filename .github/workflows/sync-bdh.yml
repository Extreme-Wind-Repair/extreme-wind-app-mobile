name: Sync BDH (VAGAS MESTRE no Dropbox para a Reuniao Diaria)

# Mantem a lista BDH_VAGAS_MESTRE da Reuniao Diaria igual a planilha VAGAS MESTRE (aba BANCO DE DADOS,
# coluna "RESUMO GESTAO A VISTA" = "BDH" ou "BANCO DE HORAS"). Roda no GitHub (sem PC e sem tarefa agendada)
# e troca SOMENTE o bloco BDH_VAGAS_MESTRE (e a data do comentario) em www/dashboard-reuniao-diaria.html.
#
# Agenda propria: a cada 30 min, 08h-20h (Brasilia), seg-sab. O gatilho do Apps Script pode ser desligado.
# Falha: abre UMA issue (sem repetir) e fecha sozinha quando voltar a funcionar.
# Manual: Actions > Sync BDH > Run workflow (dry_run = true so testa).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = so testa, nao publica; false = publica se houve mudanca"
        required: true
        default: "true"
      forcar:
        description: "(reservado) sem uso desde a troca da trava"
        required: false
        default: "false"
  schedule:
    - cron: "13,43 11-23 * * 1-6"

concurrency:
  group: sync-bdh
  cancel-in-progress: false

permissions:
  contents: write # commit/push do HTML
  actions: write  # disparar o deploy (um push feito pelo GITHUB_TOKEN nao dispara o deploy sozinho)
  issues: write   # alerta unico de falha

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install openpyxl

      - name: Gerar lista BDH
        id: rodar
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCAR: ${{ github.event.inputs.forcar || 'false' }}
        run: python tools/sync_bdh.py

      - name: Commit, push e deploy
        if: steps.rodar.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Extreme Wind Automacao"
          git config user.email "automacao@extremewind.local"
          git add www/dashboard-reuniao-diaria.html
          if git diff --cached --quiet; then
            echo "Sem mudanca apos normalizacao."
            exit 0
          fi
          git commit -m "Reuniao Diaria: lista BDH atualizada pela VAGAS MESTRE (workflow) - $(date '+%d/%m/%Y %H:%M')"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "Push falhou apos 3 tentativas."
            exit 1
          fi
          gh workflow run deploy-pages.yml --ref main

      - name: Alerta unico de falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --state open --search "Sync BDH falhou in:title" --json number --jq '.[0].number')
          if [ -z "$n" ]; then
            gh issue create --title "Sync BDH falhou" --body "A sincronizacao da lista BDH falhou em $(date '+%d/%m/%Y %H:%M'). Veja o log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Esta issue fecha sozinha quando o proximo ciclo funcionar."
          fi

      - name: Fechar alerta quando voltar ao normal
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search "Sync BDH falhou in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Voltou a funcionar em $(date '+%d/%m/%Y %H:%M')."
          done

      # 24/11/2026 (Robson): grava o status do portal na coluna de status da VAGAS MESTRE (Dropbox).
      # continue-on-error: falha aqui NUNCA derruba o BDH nem abre issue. Grava de verdade nas rodadas agendadas (manual: dry_run true so testa);
      # 24/11/2026: gravacao ligada depois de teste ponta a ponta (portal 208 tecnicos, Dropbox lido).
      - name: Gravar status do portal na VAGAS MESTRE
        continue-on-error: true
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_WRITE_REFRESH_TOKEN: ${{ secrets.DROPBOX_WRITE_REFRESH_TOKEN }}
          PORTAL_STATUS_URL: ${{ secrets.PORTAL_STATUS_URL }}
          PORTAL_STATUS_KEY: ${{ secrets.PORTAL_STATUS_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python tools/sync_mestre_status.py
