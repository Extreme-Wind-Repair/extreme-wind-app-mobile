name: Espelho front (Dropbox para o site)

# Espelha o front da Reuniao Diaria (rdo-equipes.js) do Dropbox para www/, sem PC e sem Claude.
# Roda a cada 10 min, das 08h as 20h (Brasilia), de segunda a sabado. Manual: Actions > Espelho front > Run workflow
# (dry_run = true so mostra o que mudaria). Tambem pode ser disparado pelo Apps Script (workflow_dispatch).
# Publica so se passar na sanidade (tamanho, marcador, node --check). Se falhar, o site mantem a versao anterior.

on:
  schedule:
    - cron: "*/10 11-23 * * 1-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = so testa, nao publica; false = publica o que mudou"
        required: true
        default: "true"

concurrency:
  group: espelho-front
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  espelhar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Espelhar front do Dropbox
        id: rodar
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python tools/espelho_front.py

      - name: Commit, push e deploy
        if: steps.rodar.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Extreme Wind Automacao"
          git config user.email "automacao@extremewind.local"
          while IFS= read -r f || [ -n "$f" ]; do [ -n "$f" ] && git add "www/$f"; done < changed_front.txt
          if git diff --cached --quiet; then
            echo "Sem mudanca."
            exit 0
          fi
          git commit -m "Front: rdo-equipes.js atualizado pelo Dropbox (workflow) - $(date '+%d/%m/%Y %H:%M')"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "Push falhou apos 5 tentativas."
            exit 1
          fi
          gh workflow run deploy-pages.yml --ref main
