  /* Visitante: botão Tela Cheia na barra do topo (tela cheia da página inteira, o botão de Menu continua visível) */
  function visitaTopo(){
    try {
      var badge = $('topBadge'); if (!badge || $('ewFsTop')) return;
      var b = document.createElement('button'); b.type = 'button'; b.id = 'ewFsTop'; b.className = 'badge';
      b.style.cssText = 'cursor:pointer;font-weight:700;color:var(--text);font-family:inherit;white-space:nowrap;margin-left:auto;margin-right:8px;';
      var on = function(){ return document.fullscreenElement || document.webkitFullscreenElement; };
      var lab = function(){ b.textContent = on() ? '\u21A9\uFE0F Sair da Tela Cheia' : '\u26F6 Tela Cheia'; };
      b.addEventListener('click', function(){
        try {
          var el = document.documentElement;
          if (on()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
          else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        } catch (e) {}
      });
      ['fullscreenchange', 'webkitfullscreenchange'].forEach(function(ev){ document.addEventListener(ev, lab); });
      lab(); badge.parentNode.insertBefore(b, badge);
    } catch (e) {}
  }

      '<div class="cod" id="ewVis_cod" style="display:none"></div><button class="cp" id="ewVis_cp" type="button" style="display:none">Copiar</button>' +
      '<div class="m" id="ewVis_m"></div>' +
      '<label for="ewVis_rev">Revogar um código</label><input id="ewVis_rev" maxlength="12" autocomplete="off" style="text-transform:uppercase">' +
      '<button class="go sec" id="ewVis_rv" type="button">Revogar</button>' +
      '<button class="go sec" id="ewVis_x" type="button">Fechar</button></div>';
    document.body.appendChild(m);
    var cod = $('ewVis_cod'), cp = $('ewVis_cp'), mm = $('ewVis_m');
    function fechar(){ m.classList.remove('on'); cod.style.display = 'none'; cp.style.display = 'none'; cod.textContent = ''; mm.textContent = ''; $('ewVis_cli').value = ''; $('ewVis_rev').value = ''; }
    b.addEventListener('click', function(){ m.classList.add('on'); $('ewVis_cli').focus(); });
    $('ewVis_x').addEventListener('click', fechar);
    $('ewVis_go').addEventListener('click', function(){
      var g = $('ewVis_go'), cli = $('ewVis_cli').value.trim();
      if (!cli) { msg(mm, 'Informe o nome do visitante.', false); return; }
      g.disabled = true; msg(mm, 'Aguarde...', true); cod.style.display = 'none'; cp.style.display = 'none';
      EWAuth.post({ action: 'criarConvite', cliente: cli }).then(function(r){
        if (r && r.ok) {
          cod.textContent = r.codigo; cod.style.display = 'block'; cp.style.display = 'block';
          msg(mm, 'Código gerado para ' + r.cliente + '. Vale ' + r.validoHoras + ' h. Ele aparece só agora: copie e envie.', true);
        } else {
          msg(mm, r && r.motivo === 'NEGADO' ? 'Sem permissão.' : (r && r.motivo === 'CLIENTE_OBRIGATORIO' ? 'Informe o nome do visitante.' : (MOT[r && r.motivo] || ('Falhou: ' + (r && r.motivo)))), false);
        }
      }).then(function(){ g.disabled = false; });
    });
    cp.addEventListener('click', function(){
      var t = cod.textContent;
      try { navigator.clipboard.writeText(t).then(function(){ cp.textContent = 'Copiado'; setTimeout(function(){ cp.textContent = 'Copiar'; }, 1500); }, function(){}); } catch (e) {}
    });
    $('ewVis_rv').addEventListener('click', function(){
      var c = $('ewVis_rev').value.trim().toUpperCase().replace(/\s/g, '');
      if (!c) { msg(mm, 'Informe o código a revogar.', false); return; }
      EWAuth.post({ action: 'revogarConvite', codigo: c }).then(function(r){
        if (r && r.ok) { msg(mm, 'Código revogado.', true); $('ewVis_rev').value = ''; }
        else msg(mm, r && r.motivo === 'NAO_ENCONTRADO' ? 'Código não encontrado.' : (r && r.motivo === 'NEGADO' ? 'Sem permissão.' : ('Falhou: ' + (r && r.motivo))), false);
      });
    });
  }

  function bloquear(){ fimVerificacao(); limparOk(); document.body.classList.add('ew-locked'); $('ewSub').textContent = 'Acesso restrito. Entre com sua matrícula.'; }

  function ligar(btn, el, fn){
    btn.addEventListener('click', function(){
      btn.disabled = true; msg(el, 'Aguarde...', true);
      fn().then(function(r){
        if (r && r.ok) { msg(el, 'Ok.', true); abrir(r); } else { falha(el, r); }
      }).then(function(){ btn.disabled = false; });
    });
  }
  ligar($('ewL_go'), $('ewL_m'), function(){ var s = $('ewL_sen').value; $('ewL_sen').value = ''; return EWAuth.login($('ewL_mat').value.trim(), s, $('ewL_lem').checked); });
  ligar($('ewA_go'), $('ewA_m'), function(){
    var d = { matricula: $('ewA_mat').value.trim(), cpf: $('ewA_cpf').value.trim(), nascimento: $('ewA_nas').value.trim(), senhaNova: $('ewA_sen').value };
    $('ewA_cpf').value = ''; $('ewA_nas').value = ''; $('ewA_sen').value = ''; return EWAuth.ativar(d);
  });
  ligar($('ewV_go'), $('ewV_m'), function(){ return EWAuth.entrarConvite($('ewV_cod').value.trim()); });

  $('ewR_pedir').addEventListener('click', function(){
    var b = $('ewR_pedir'); b.disabled = true; msg($('ewR_m1'), 'Aguarde...', true);
    EWAuth.pedirRecuperacao($('ewR_mat').value.trim()).then(function(r){
      if (r && r.ok) msg($('ewR_m1'), r.mensagem || 'Pedido enviado.', true); else falha($('ewR_m1'), r);
    }).then(function(){ b.disabled = false; });
  });
  $('ewR_conf').addEventListener('click', function(){
    var b = $('ewR_conf'); b.disabled = true; msg($('ewR_m2'), 'Aguarde...', true);
    var d = { matricula: $('ewR_mat').value.trim(), codigo: $('ewR_cod').value.trim(), nascimento: $('ewR_nas').value.trim(), senhaNova: $('ewR_sen').value };
    $('ewR_cod').value = ''; $('ewR_nas').value = ''; $('ewR_sen').value = '';
    EWAuth.confirmarRecuperacao(d).then(function(r){
      if (r && r.ok) { msg($('ewR_m2'), 'Senha trocada. Volte para "Entrar" e use a senha nova.', true); } else falha($('ewR_m2'), r);
    }).then(function(){ b.disabled = false; });
  });

  $('ewSair').addEventListener('click', function(){ limparOk(); EWAuth.sair().then(function(){ location.reload(); }); });
  window.addEventListener('message', function(ev){
    if (ev.origin === location.origin && ev.data && ev.data.ew === 'sessao-perdida') { EWAuth.limpar(); limparOk(); location.reload(); }
  });

  if (!EWAuth.configurado()) { $('ewCfg').className = 'm er'; $('ewCfg').textContent = MOT.NAO_CONFIGURADO; }
  var tok = EWAuth.token();
  if (!tok) { bloquear(); }
  else {
    var inf = EWAuth.info();
    if (recente() && !(inf && inf.perfil === 'VISITANTE')) { document.body.classList.remove('ew-locked'); carregarIframes(false); fimVerificacao(); }   // abre na hora; o servidor confirma em segundo plano
    EWAuth.raw({ action: 'sessao', token: tok }).then(function(r){
      if (r && r.ok) abrir(r);
      else if (r && r.motivo === 'SESSAO') { EWAuth.limpar(); bloquear(); }                 // sessão vencida/revogada: só aqui pede senha
      else if (document.body.classList.contains('ew-locked')) {                              // sem rede / erro do servidor: MANTÉM o token
        fimVerificacao(); falha($('ewL_m'), r);
      }
    });
  }
})();
</script>
