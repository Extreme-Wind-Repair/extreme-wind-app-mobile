<style>
  /* ===== Login (Acesso EW) ===== */
  body.ew-locked .app{display:none;}
  html.ew-checking #ewLogin .box{display:none;}
  html.ew-checking #ewLogin::after{content:'Verificando acesso...'; color:#93a4b3; font:14px system-ui,Segoe UI,Roboto,sans-serif;}
  #ewLogin{position:fixed; inset:0; z-index:9999; display:none; align-items:center; justify-content:center; background:#0b1620; padding:16px; overflow:auto;}
  body.ew-locked #ewLogin{display:flex;}
  #ewLogin .box{width:100%; max-width:380px; background:#13222f; border:1px solid #243645; border-radius:12px; padding:20px 18px; color:#e8eef3; font-family:system-ui,Segoe UI,Roboto,sans-serif;}
  #ewLogin h1{font-size:18px; margin:10px 0 2px;} #ewLogin p.s{color:#93a4b3; font-size:13px; margin:0 0 12px;}
  #ewLogin .tabs{display:flex; gap:6px; margin:10px 0 6px; flex-wrap:wrap;}
  #ewLogin .tabs button{flex:1; min-width:90px; padding:7px 6px; font-size:12.5px; border-radius:7px; border:1px solid #2b4357; background:transparent; color:#9fb4c6; cursor:pointer;}
  #ewLogin .tabs button.on{background:#0b5cad; border-color:#0b5cad; color:#fff;}
  #ewLogin label{display:block; font-size:12.5px; color:#93a4b3; margin:9px 0 3px;}
  #ewLogin input{width:100%; box-sizing:border-box; padding:10px; border-radius:7px; border:1px solid #2b4357; background:#0e1b26; color:#e8eef3; font:inherit; font-size:15px;}
  #ewLogin label.lem{display:flex; align-items:center; gap:8px; margin:12px 0 0; font-size:13px; color:#b4c3d0; cursor:pointer;}
  #ewLogin label.lem input{width:auto; margin:0; padding:0; accent-color:#0b5cad;}
  #ewLogin .go{width:100%; margin-top:14px; padding:11px; border:0; border-radius:7px; background:#0b5cad; color:#fff; font:inherit; font-size:15px; cursor:pointer;}
  #ewLogin .go:disabled{opacity:.55; cursor:wait;}
  #ewLogin .m{margin-top:10px; font-size:13.5px; min-height:18px; white-space:pre-wrap;} #ewLogin .m.er{color:#ff8a80;} #ewLogin .m.ok{color:#59d38c;}
  #ewLogin .painel{display:none;} #ewLogin .painel.on{display:block;}
  #ewLogin img.logo{height:64px; width:auto; display:block; margin:0 auto 6px;}
  .ew-sair{margin-left:10px; padding:5px 10px; font-size:12px; border-radius:7px; border:1px solid #2b4357; background:transparent; color:#9fb4c6; cursor:pointer;}
</style>
<script>try{ if (sessionStorage.getItem('ew_tok') || localStorage.getItem('ew_tok')) document.documentElement.classList.add('ew-checking'); }catch(e){}</script>
